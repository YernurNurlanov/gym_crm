version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: gym-postgres
    environment:
      - POSTGRES_DB=gym_crm
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=123
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    networks:
      - gym-network

  activemq:
    image: apache/activemq-classic:latest
    container_name: gym-activemq
    ports:
      - "8161:8161"
      - "61616:61616"
    volumes:
      - activemq_data:/opt/activemq/data
    networks:
      - gym-network

  mongodb:
    image: mongo:8.0
    container_name: gym-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
    volumes:
      - mongo_data:/data/db
    networks:
      - gym-network

  main:
    build:
      context: ./gym-crm-service
      dockerfile: Dockerfile
    container_name: main
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/gym_crm
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: 123

      SPRING_ACTIVEMQ_BROKER_URL: tcp://activemq:61616
      SPRING_ACTIVEMQ_USER: admin
      SPRING_ACTIVEMQ_PASSWORD: admin

      SPRING_PROFILES_ACTIVE: local
    depends_on:
      - postgres
      - activemq
    networks:
      - gym-network

  report:
    build:
      context: ./trainer-workload-service
      dockerfile: Dockerfile
    container_name: gym-report
    ports:
      - "8081:8081"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://admin:admin@mongodb:27017/trainer-workload-db?authSource=admin&authMechanism=SCRAM-SHA-256

      SPRING_ACTIVEMQ_BROKER_URL: tcp://activemq:61616
      SPRING_ACTIVEMQ_USER: admin
      SPRING_ACTIVEMQ_PASSWORD: admin
    depends_on:
      - mongodb
      - activemq
    networks:
      - gym-network

networks:
  gym-network:
    driver: bridge

volumes:
  db_data:
  activemq_data:
  mongo_data: