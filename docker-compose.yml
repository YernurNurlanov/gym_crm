version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: epam
    environment:
      - POSTGRES_DB=gym_crm
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=123
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d

  activemq:
    image: apache/activemq-classic:latest
    container_name: activemq
    ports:
      - "8161:8161"
      - "61616:61616"
    volumes:
      - activemq_data:/opt/activemq/data

  mongodb:
    image: mongo:8.0
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
    volumes:
      - mongo_data:/data/db

volumes:
  db_data:
  activemq_data:
  mongo_data: