version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: epam
    environment:
      - POSTGRES_DB=gym_crm
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=123
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d

volumes:
  db_data: